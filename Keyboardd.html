<html>
 <head>
  <title>CSS Keyboard</title>
  <style>
    .keyboard {
      display: grid;
      grid-template-columns: repeat(16, 40px);
      gap: 20px;
      padding: 20px;
      background: white;
      width:max-content;
      margin: 100px;
      margin-left: 140px;
      margin-top: 120px;
      border: 5px solid burlywood;
    }

    .key {
      display: grid;
      justify-content: center;
      align-items: center;
      height: 30px;
      background: silver;
      border: 3px solid white;
      border-radius: 10px;
      font-family:Monospace;
    }
   
   
    .key.wide { grid-column: span 2; }
    .key.space { grid-column: span 5; }

  </style>
</head>
<body>
